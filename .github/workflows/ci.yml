name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  go-services:
    name: Go ${{ matrix.service }} — vet, test, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - Furkan-Alp-Gunay
          - Cem-Karaca
          - Salih-Arda-Katircioglu
          - Enes-Coban
          - Yakup-Efe-Celebi
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bose
          POSTGRES_PASSWORD: bose
          POSTGRES_DB: bose
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U bose"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports: [5672:5672]
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: postgres://bose:bose@localhost:5432/bose?sslmode=disable
      JWT_SECRET: bose_super_gizli_anahtar_2026
      REDIS_URL: redis://localhost:6379
      RABBITMQ_URL: amqp://guest:guest@localhost:5672/
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: go mod download
        working-directory: ${{ matrix.service }}
        run: go mod download
      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
      - name: go test
        working-directory: ${{ matrix.service }}
        # -race AND the sqlite test driver (gorm.io/driver/sqlite -> mattn/go-sqlite3)
        # both require cgo; the job-level CGO_ENABLED=0 (kept for static builds) breaks them.
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -cover
      - name: go build
        working-directory: ${{ matrix.service }}
        run: go build -o /tmp/${{ matrix.service }}-bin .

  docker-build:
    name: docker compose build smoke
    runs-on: ubuntu-latest
    needs: go-services
    steps:
      - uses: actions/checkout@v5
      - name: docker compose build
        run: docker compose build

  frontends:
    name: Web frontend ${{ matrix.member }} — build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member:
          - Furkan-Alp-Gunay
          - Cem-Karaca
          - Salih-Arda-Katircioglu
          - Enes-Coban
          - Yakup-Efe-Celebi
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.member }}/frontend/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.member }}/frontend
        run: npm ci || npm install
      - name: build
        working-directory: ${{ matrix.member }}/frontend
        run: npm run build --if-present
