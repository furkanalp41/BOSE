version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bose
      POSTGRES_PASSWORD: bose_secret
      POSTGRES_DB: bose
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bose"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: "host=db user=bose password=bose_secret dbname=bose port=5432 sslmode=disable"
      JWT_SECRET: "bose-production-secret-change-me"
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
